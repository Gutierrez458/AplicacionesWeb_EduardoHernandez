<div class="main-wrapper" style="background-color: #ffffff; min-height: 100vh; padding: 40px 0; font-family: 'Segoe UI', Arial, sans-serif;">
  
  <div class="container">
    
    <div class="text-center mb-5">
      <h1 style="color: #2b7fff; font-weight: bold; text-transform: uppercase; border-bottom: 3px solid #2b7fff; display: inline-block; padding-bottom: 10px; font-size: 2.2rem; letter-spacing: 1px;">
        CATÁLOGO DE VIDEOJUEGOS
      </h1>
    </div>

    <div class="row justify-content-center" *ngIf="mensajeExito">
      <div class="col-md-7">
        <div class="alert shadow-sm d-flex align-items-center" style="background-color: #e7f3ff; color: #2b7fff; border: 1px solid #d0e7ff; border-radius: 8px; font-weight: 600;">
          <span class="me-2">✅</span> {{ mensajeExito }}
        </div>
      </div>
    </div>

    <div id="formulario-registro" class="row justify-content-center mb-5">
      <div class="col-md-7">
        <div class="card p-4 shadow-sm" style="background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px;">
          <h6 class="fw-bold mb-4 text-dark" style="font-size: 0.9rem;">Añadir Nuevo Título</h6>
          
          <form (ngSubmit)="guardar()" #form="ngForm">
            <div class="row mb-3 align-items-center">
              <div class="col-md-4 text-end">
                <label class="small fw-bold text-dark">Nombre del Juego</label>
              </div>
              <div class="col-md-8">
                <input type="text" name="nombre" [(ngModel)]="nuevo.nombre" required class="form-control form-control-sm border-secondary-subtle" placeholder="Ej: God of War">
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <div class="col-md-4 text-end">
                <label class="small fw-bold text-dark">Género</label>
              </div>
              <div class="col-md-8">
                <input type="text" name="genero" [(ngModel)]="nuevo.genero" required class="form-control form-control-sm border-secondary-subtle" placeholder="Acción">
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <div class="col-md-4 text-end">
                <label class="small fw-bold text-dark">Precio ($)</label>
              </div>
              <div class="col-md-8">
                <input type="number" name="precio" [(ngModel)]="nuevo.precio" required class="form-control form-control-sm border-secondary-subtle">
              </div>
            </div>

            <div class="row mb-4 align-items-center">
              <div class="col-md-4 text-end">
                <label class="small fw-bold text-dark">Ruta de Imagen</label>
              </div>
              <div class="col-md-8">
                <input type="text" name="imagenUrl" [(ngModel)]="nuevo.imagenUrl" required class="form-control form-control-sm border-secondary-subtle" placeholder="img/mapache.jpg">
              </div>
            </div>

            <div class="text-start" style="margin-left: 33.3%;">
              <button class="btn btn-light border fw-bold text-uppercase px-3 shadow-sm" style="font-size: 0.75rem; color: #555; background-color: #f8f9fa;" [disabled]="!form.valid">
                REGISTRAR
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="catalogo-juegos" class="row">
      <div class="col-md-4 mb-4" *ngFor="let j of games">
        <div class="card h-100 shadow-sm border-0" style="background-color: #ffffff; border-radius: 12px; border: 1px solid #f0f0f0 !important;">
          
          <div class="p-3 text-center">
            <img [src]="'http://localhost:5000/' + j.imagenUrl" 
                class="img-fluid" 
                [alt]="j.nombre"
                style="height: 180px; object-fit: contain;">
          </div>

          <div class="card-body pt-0">
            <div class="text-end mb-1">
              <span class="small text-muted" style="font-size: 0.75rem;">{{ j.genero }}</span>
            </div>
            <h5 class="fw-bold mb-1" style="color: #000; font-size: 1.1rem;">{{ j.nombre }}</h5>
            <p class="fw-bold mb-3" style="color: #333; font-size: 1.2rem;">${{ j.precio }}</p>
            
            <button class="btn btn-light border btn-sm fw-bold text-uppercase w-100" style="font-size: 0.7rem; color: #888; background-color: #fdfdfd;" (click)="abrirModalEliminar(j)">
              Eliminar Registro
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="modal d-block" *ngIf="mostrarModalEliminar" style="background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 10px;">
      <div class="modal-header bg-light border-0">
        <h6 class="modal-title fw-bold text-dark">Confirmar acción</h6>
        <button type="button" class="btn-close" (click)="cerrarModal()" style="font-size: 0.7rem;"></button>
      </div>
      <div class="modal-body text-center py-4">
        <p class="mb-0" style="color: #444;">¿Seguro que quieres borrar <strong>{{ juegoAEliminar?.nombre }}</strong>?</p>
      </div>
      <div class="modal-footer bg-light border-0 px-4">
        <button class="btn btn-secondary btn-sm px-3" (click)="cerrarModal()">No, cancelar</button>
        <button class="btn btn-danger btn-sm px-4 fw-bold" (click)="confirmarEliminar()">SÍ, ELIMINAR</button>
      </div>
    </div>
  </div>
</div>

<div class="container mt-4">
  <div class="row g-4">
    <div class="col-md-4 col-lg-3" *ngFor="let juego of listaGames">
      <div class="card h-100 shadow-sm">
        <img [src]="juego.imagenUrl" class="card-img-top p-2" style="height:180px; object-fit:cover;">
        <div class="card-body text-center">
          <h5 class="card-title">{{ juego.nombre }}</h5>
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-warning btn-sm" (click)="editarGame(juego)">Editar</button>
            
            <button class="btn btn-danger btn-sm" 
                    data-bs-toggle="modal" 
                    data-bs-target="#modalEliminar" 
                    (click)="juegoAEliminar = juego._id">
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmar eliminación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        ¿Estás seguro de que deseas eliminar este videojuego?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" 
                class="btn btn-danger" 
                (click)="eliminarGame(juegoAEliminar)" 
                data-bs-dismiss="modal">
          Sí, eliminar
        </button>
      </div>
    </div>
  </div>
</div>

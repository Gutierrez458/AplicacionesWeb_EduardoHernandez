<div class="container mt-4">

  <div class="p-3 mb-4 rounded" style="background: linear-gradient(90deg,#1e3c72,#2a5298); color:white;">
    <div class="d-flex justify-content-between align-items-center">
      <h2 class="m-0">Lista de Videojuegos</h2>
      <a routerLink="/nuevo" class="btn btn-light fw-bold">
        + Nuevo Videojuego
      </a>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-4 col-lg-3" *ngFor="let juego of listaGames">
      <div class="card h-100 shadow-sm">
        <img [src]="juego.imagenUrl"
            class="card-img-top p-2"
            style="height:180px; object-fit:cover;">
        <div class="card-body text-center">
          <h5 class="card-title">{{ juego.nombre }}</h5>
          <p class="text-muted mb-1">
            {{ juego.genero }}
          </p>
          <p class="fw-bold">
            ${{ juego.precio }}
          </p>
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-warning btn-sm"
                    (click)="editarGame(juego)">
              Editar
            </button>
            <button class="btn btn-danger btn-sm"
                    (click)="confirmarEliminar(juego._id)">
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

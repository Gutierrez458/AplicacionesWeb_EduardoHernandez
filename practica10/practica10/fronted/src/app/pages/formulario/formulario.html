<div class="container mt-5">

  <!-- Header -->
  <div class="p-3 mb-4 rounded text-white"
      style="background: linear-gradient(90deg,#1e3c72,#2a5298);">
    <h2 class="m-0">Agregar Nuevo Videojuego</h2>
  </div>

  <!-- Card del formulario -->
  <div class="card shadow-lg border-0">
    <div class="card-body p-4">

      <form (ngSubmit)="guardarGame()">

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Nombre</label>
            <input type="text"
                  class="form-control"
                  placeholder="Ej: God of War Ragnarok"
                  [(ngModel)]="game.nombre"
                  name="nombre"
                  required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Género</label>
            <input type="text"
                  class="form-control"
                  placeholder="Ej: Acción / Aventura"
                  [(ngModel)]="game.genero"
                  name="genero"
                  required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Precio</label>
            <input type="number"
                  class="form-control"
                  placeholder="Ej: 1200"
                  [(ngModel)]="game.precio"
                  name="precio"
                  required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">URL de Imagen</label>
            <input type="text"
                  class="form-control"
                  placeholder="https://imagen-del-juego.jpg"
                  [(ngModel)]="game.imagenUrl"
                  name="imagenUrl"
                  required>
          </div>

        </div>

        <!-- Botones -->
        <div class="mt-4 d-flex gap-2">

          <button type="submit" class="btn btn-success px-4">
            Guardar
          </button>

        </div>

      </form>

    </div>
  </div>

</div>

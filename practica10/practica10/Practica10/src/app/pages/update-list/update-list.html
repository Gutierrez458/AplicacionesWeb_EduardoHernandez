<div class="container">
  <h2 class="section-title">Selecciona un juego para actualizar</h2>

  <div class="cards">
    <div class="card" *ngFor="let j of games">
      <div class="card-image">
        <img [src]="'http://localhost:5000/img/' + j.imagenUrl" [alt]="j.nombre">
      </div>
      <div class="card-body">
        <h3 class="game-name">{{ j.nombre }}</h3>
        <p><strong>Genero:</strong> {{ j.genero }}</p>
        <p><strong>Precio:</strong> ${{ j.precio }}</p>
        <button class="btn btn-primary btn-sm" (click)="seleccionarParaActualizar(j)">Actualizar</button>
      </div>
    </div>
  </div>
</div>

<h2>Actualizar Juego</h2>

<form (ngSubmit)="guardar()">

  <label>Nombre:</label>
  <input type="text" [(ngModel)]="juego.nombre" name="nombre" required>

  <label>Género:</label>
  <input type="text" [(ngModel)]="juego.genero" name="genero" required>

  <label>Precio:</label>
  <input type="number" [(ngModel)]="juego.precio" name="precio" required>

  <br><br>

  <button type="submit">Guardar cambios</button>
  <button type="button" (click)="cancelar()">Cancelar</button>

</form>
